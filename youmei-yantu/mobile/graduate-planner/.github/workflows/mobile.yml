name: Build mobile artifacts
on: workflow_dispatch
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: node prepare.cjs && npx cap sync android
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: Android-debug-test-only, path: android/app/build/outputs/apk/debug/app-debug.apk}
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: node prepare.cjs && npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with: {name: iOS-simulator-not-installable-on-iPhone, path: build/ios/Build/Products/Debug-iphonesimulator/App.app}
